<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sergio Ricardo Molina | Fotografía</title>
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1A6PFi2lpp_VNhnmtTYGkYXyjMZ1p8LhA">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Configuración base para Celular */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #111; 
      color: #fff; 
      padding: 15px; 
      max-width: 600px; 
      margin: 0 auto; 
    }
    
    header { text-align: center; padding: 20px 0; }
    h1 { font-size: 1.3rem; letter-spacing: 1px; font-weight: 300; line-height: 1.4; }
    h1 span { display: block; font-size: 0.9rem; color: #aaa; margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }

    /* VISTA GRID (Móvil: 2 columnas) */
    .grid-categorias { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
    .card-categoria { background: #222; border: 1px solid #333; border-radius: 12px; height: 120px; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: 500; letter-spacing: 1px; color: #fff; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s ease, background 0.2s ease; }
    .card-categoria:active { transform: scale(0.96); background: #2a2a2a; }
    .btn-clientes { grid-column: 1 / -1; background: #004466; border: 1px solid #005580; }

    /* GALERÍA (Móvil: 3 columnas) */
    .contenedor-galeria { display: none; }
    .cabecera-galeria { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .btn-volver { background: #222; color: #fff; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    .galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    
    .item-foto { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .galeria img { width: 100%; height: 100%; object-fit: cover; }

    /* MODAL */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
    .contenedor-modal-img { position: relative; display: flex; justify-content: center; align-items: center; max-width: 100%; max-height: 85vh; }
    .modal img { max-width: 100%; max-height: 85vh; object-fit: contain; }
    
    .btn-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 2rem; padding: 15px; cursor: pointer; z-index: 1001; }
    .btn-prev { left: 10px; } .btn-next { right: 10px; }
    .btn-cerrar { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; z-index: 1001; }


    /* ==========================================
       ADAPTACIÓN PARA COMPUTADORAS / PANTALLAS GRANDES
       ========================================== */
    @media (min-width: 768px) {
      body {
        max-width: 950px; /* Se expande en PC */
        padding: 30px;
      }

      h1 { font-size: 1.8rem; }
      h1 span { font-size: 1.1rem; }

      /* El menú pasa a tener 3 columnas en PC */
      .grid-categorias {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .card-categoria {
        height: 140px; /* Tarjetas más cómodas para PC */
        font-size: 1.25rem;
      }

      /* La galería pasa a tener 4 columnas en PC para aprovechar el ancho */
      .galeria {
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <div id="vista-menu">
    <header><h1>Sergio Ricardo Molina<span>Fotografía</span></h1></header>
    <main>
      <div class="grid-categorias">
        <div class="card-categoria" onclick="abrirSeccionTexto()">Sobre mi</div>
        <div class="card-categoria" onclick="abrirGaleria('Ensayos', '1K4h3SPq2WdCEMMzrTSToD-quebXDD4rS')">Ensayos</div>
        <div class="card-categoria" onclick="abrirGaleria('Paisajes', '1W-eFu0G6mqggGw6TN7bSU9Dvz0k2h70M')">Paisajes</div>
        <div class="card-categoria" onclick="abrirGaleria('Retratos', '1cRFXW5h8P_z6gd0Zz91tct77Or5CBBZM')">Retratos</div>
        <div class="card-categoria" onclick="abrirGaleria('Sesiones', '1IReNcUgPTRAa9nj3-u38QstyZWV9n6RY')">Sesiones</div>
        <div class="card-categoria" onclick="abrirGaleria('Eventos', '1Om0Aj2SeALgU-V--GxgMN7a_DxWI0hvJ')">Eventos</div>
        <div class="card-categoria btn-clientes" onclick="pedirPassword()">Acceso Clientes 🔒</div>
      </div>
    </main>
  </div>

  <div id="vista-galeria" class="contenedor-galeria">
    <div class="cabecera-galeria">
      <button class="btn-volver" onclick="mostrarMenu()">← Volver</button>
      <h2 class="titulo-categoria" id="titulo-categoria"></h2>
    </div>
    <main class="galeria" id="galeria"></main>
  </div>

  <div id="vista-sobre-mi" class="contenedor-galeria">
    <div class="cabecera-galeria"><button class="btn-volver" onclick="mostrarMenu()">← Volver</button></div>
    <div style="text-align: center; padding: 40px; font-size: 1.1rem; line-height: 1.6;">
      <p>Fotógrafo Profesional Autorizado.</p>
    </div>
  </div>

  <div class="modal" id="modal" onclick="cerrarVisorFondo(event)">
    <span class="btn-cerrar" onclick="cerrarVisor()">×</span>
    <span class="btn-nav btn-prev" onclick="cambiarFoto(-1, event)">&#10094;</span>
    <div class="contenedor-modal-img">
      <img id="img-ampliada" src="" alt="Vista">
    </div>
    <span class="btn-nav btn-next" onclick="cambiarFoto(1, event)">&#10095;</span>
  </div>

  <script>
    const API_KEY = 'AIzaSyAHNvLODt54qLomj14TUPbQyo-KJ_HO4ZM'; 
    const clientes = {
      "memes": "1BD9lEZq4QAnF0GSerfix0n85HHUI3ux8",
      "familia2026": "1KcKqJnYUobJaRdsrfBVgyVrTRer2IcKS"
    };

    let fotosActuales = [];
    let indiceFotoActual = 0;

    async function cargarFotos(folderId) {
      const galeria = document.getElementById('galeria');
      galeria.innerHTML = 'Cargando...';
      fotosActuales = [];
      
      const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'&key=${API_KEY}&fields=files(id,name)`;
      
      try {
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        galeria.innerHTML = '';
        datos.files.forEach((archivo, index) => {
          const urlImg = `https://lh3.googleusercontent.com/d/${archivo.id}=w800`;
          fotosActuales.push(`https://lh3.googleusercontent.com/d/${archivo.id}=w1600`);
          
          const div = document.createElement('div');
          div.className = 'item-foto';
          div.innerHTML = `<img src="${urlImg}" loading="lazy">`;
          div.onclick = () => abrirVisor(index);
          galeria.appendChild(div);
        });
      } catch (e) { galeria.innerHTML = 'Error al cargar fotos.'; }
    }

    function abrirVisor(index) {
      indiceFotoActual = index;
      document.getElementById('img-ampliada').src = fotosActuales[indiceFotoActual];
      document.getElementById('modal').style.display = 'flex';
    }

    function pedirPassword() {
      const pass = prompt("Contraseña:");
      if(clientes[pass]) abrirGaleria("Tu Sesión", clientes[pass]);
    }
    function abrirGaleria(tit, id) { document.getElementById('vista-menu').style.display='none'; document.getElementById('vista-galeria').style.display='block'; document.getElementById('titulo-categoria').innerText=tit; cargarFotos(id); }
    function mostrarMenu() { location.reload(); }
    function cerrarVisor() { document.getElementById('modal').style.display='none'; }
    function cerrarVisorFondo(e) { if(e.target.id==='modal') cerrarVisor(); }
    function cambiarFoto(d, e) { if(e) e.stopPropagation(); indiceFotoActual = (indiceFotoActual + d + fotosActuales.length) % fotosActuales.length; document.getElementById('img-ampliada').src = fotosActuales[indiceFotoActual]; }
    function abrirSeccionTexto() { document.getElementById('vista-menu').style.display='none'; document.getElementById('vista-sobre-mi').style.display='block'; }
  </script>
</body>
</html>
